<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant - SevaBot</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .centered-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
    }
    .coming-soon-text {
      font-size: 2.25rem;
      font-weight: 600;
      color: var(--secondary-text);
      margin-bottom: 24px;
    }
    
    /* Voice Assistant Styles */
    .mic-btn {
      border-radius: 50%;
      min-width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      border: none;
      background-color: var(--primary-color);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .mic-btn:hover {
      transform: scale(1.05);
    }
    .pulse {
      animation: pulse-animation 1.5s infinite;
      background-color: #ff4d4d !important;
      color: white !important;
    }
    @keyframes pulse-animation {
      0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
    }
  </style>
</head>
<body class="dynamic-landing-page">
  <!-- Soft Background Effects Layer -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <header class="top-nav" style="display: flex; justify-content: space-between; align-items: center; margin: 0 auto; margin-bottom: 24px; padding: 24px 5%; width: 100%; max-width: 1800px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 24px;">
      <button onclick="window.history.back()" class="nav-btn" data-i18n="Back">&#8592; Back</button>
      <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
        <img src="logo.jpg" alt="SevaBot Logo" style="width: 36px; height: 36px; border-radius: 50%;">
        <div class="logo">SevaBot</div>
      </a>
    </div>
    
    <nav class="main-nav" style="margin-bottom: 0; border: none; padding-bottom: 0; display: flex; gap: 32px; align-items: center;">
      <a href="index.html" class="nav-link" data-i18n="Home">Home</a>
      <a href="personalized-schemes.html" class="nav-link" data-i18n="Personalized Schemes">Personalized Schemes</a>
      <a href="explore.html" class="nav-link" data-i18n="Explore Schemes">Explore Schemes</a>
      <a href="assistant.html" class="nav-link active" data-i18n="AI Assistant">AI Assistant</a>
    </nav>

    <div id="nav-right-container" style="display: flex; align-items: center; gap: 12px; position: relative;">
      <div id="nav-profile-icon" onclick="toggleDropdown()" style="display: none; width: 44px; height: 44px; border-radius: 50%; background-color: #e0f2fe; color: #0369a1; align-items: center; justify-content: center; font-weight: 600; font-size: 1.25rem; border: 2px solid #bae6fd; cursor: pointer; transition: transform 0.2s;"></div>
      <!-- Profile Dropdown -->
      <div id="profile-dropdown" style="display: none; position: absolute; top: 60px; right: 0; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 8px; width: 250px; z-index: 1000;">
        <a href="previous-schemes.html" style="display: block; text-decoration: none; padding: 12px 16px; cursor: pointer; border-radius: 8px; font-weight: 500; font-size: 0.95rem; color: var(--primary-text); transition: background 0.2s;" onmouseover="this.style.background='#f0f9ff'" onmouseout="this.style.background='transparent'" data-i18n="My Profile">My Profile</a>
        <div onclick="handleLogout()" style="padding: 12px 16px; cursor: pointer; border-radius: 8px; font-weight: 500; font-size: 0.95rem; color: #ef4444; margin-top: 4px; transition: background 0.2s;" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='transparent'" data-i18n="Logout">Logout</div>
      </div>
      <script>
        function toggleDropdown() {
          const dropdown = document.getElementById("profile-dropdown");
          dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }
        function handleLogout() {
          localStorage.removeItem("userProfile");
          window.location.href = "index.html";
        }
        document.addEventListener("DOMContentLoaded", () => {
          const userStr = localStorage.getItem("userProfile");
          const profileIcon = document.getElementById("nav-profile-icon");
          if (userStr && profileIcon) {
            try {
              const userData = JSON.parse(userStr);
              if (userData.name) {
                profileIcon.textContent = userData.name.charAt(0).toUpperCase();
                profileIcon.style.display = "flex";
              }
            } catch(e){}
          }
        });
      </script>
    </div>
  </header>
  
  <div class="container" style="padding-top: 24px;">

    <header style="justify-content: center; margin-bottom: 24px;">
      <h1 id="page-title" style="text-align: center; color: var(--heading-color);" data-i18n="AI Assistant">AI Assistant</h1>
    </header>

    <main class="chat-container">
      <!-- AI First Message -->
      <div class="chat-bubble ai-message">
        <p data-i18n="Hello 👋 Tell me your situation and I will help you find suitable schemes. You can speak to me!">Hello 👋 Tell me your situation and I will help you find suitable schemes. You can speak to me!</p>
      </div>

      <!-- Chat Input Area -->
      <div class="chat-input-wrapper" style="display: flex; gap: 12px; margin-top: 32px; align-items: center;">
        <button id="mic-btn" class="mic-btn" title="Click to Speak" aria-label="Microphone">🎤</button>
        <input id="chat-input" type="text" data-i18n="Type or click the mic to speak..." placeholder="Type or click the mic to speak..." style="flex-grow: 1; padding: 16px 20px; font-size: 1.125rem; border-radius: 32px; border: 1px solid var(--border-color); background-color: var(--surface-color); color: var(--primary-text); outline: none;">
        <button id="send-btn" class="btn" data-i18n="Send" style="border-radius: 32px; padding: 16px 32px; width: auto; box-shadow: none;">Send</button>
      </div>
    </main>
  </div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const inputField = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const wrapper = document.querySelector('.chat-input-wrapper');
    const sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
    
    let localChatState = "init";

    // Global Audio context to forcefully overdrive system audio limits
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    window.activeAudioNode = null;

    // Amplified Text to Speech Function
    async function speakText(text) {
      if (!text) return;

      const currentLang = localStorage.getItem('lang') || 'en';
      let langCode = 'en-US';
      if (currentLang === 'hi') langCode = 'hi-IN';
      else if (currentLang === 'kn') langCode = 'kn-IN';

      try {
        const response = await fetch('/api/tts', {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({ text: text, lang: langCode })
        });

        if (response.ok) {
           const data = await response.json();
           
           if (window.activeAudioNode) window.activeAudioNode.pause();

           const audio = new Audio(data.audio_url);
           audio.crossOrigin = "anonymous";
           window.activeAudioNode = audio;

           if (audioContext.state === 'suspended') {
               await audioContext.resume();
           }

           const source = audioContext.createMediaElementSource(audio);
           const gainNode = audioContext.createGain();
           
           // Set normal volume for clear voice
           gainNode.gain.value = 1.0;
           
           source.connect(gainNode);
           gainNode.connect(audioContext.destination);

           audio.play();
        } else {
           throw new Error("TTS Route Failed");
        }
      } catch (err) {
        console.warn("Falling back to standard browser TTS:", err);
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = langCode;
          utterance.rate = 0.9;
          utterance.pitch = 1.0;
          utterance.volume = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      }
    }

    // Auto-speak the welcome message on load (Optional, uncomment if desired)
    // speakText("Hello. Tell me your situation and I will help you find suitable schemes. You can speak to me!");

    // Speech to Text (Recognition) Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        micBtn.classList.add('pulse');
        inputField.placeholder = (typeof window.t === 'function' ? window.t('Listening...') : 'Listening...');
      };

      recognition.onspeechend = function() {
        recognition.stop();
        micBtn.classList.remove('pulse');
        inputField.placeholder = (typeof window.t === 'function' ? window.t("Type or click the mic to speak...") : "Type or click the mic to speak...");
      };

      recognition.onresult = function(event) {
        micBtn.classList.remove('pulse');
        const transcript = event.results[0][0].transcript;
        inputField.value = transcript;
        inputField.placeholder = (typeof window.t === 'function' ? window.t("Type or click the mic to speak...") : "Type or click the mic to speak...");
        sendMessage(); // Automatically send after speaking
      };

      recognition.onerror = function(event) {
        micBtn.classList.remove('pulse');
        inputField.placeholder = (typeof window.t === 'function' ? window.t("Type or click the mic to speak...") : "Type or click the mic to speak...");
        console.error("Speech recognition error", event.error);
      };

      micBtn.addEventListener('click', () => {
        // Dynamic Language Selection for listening
        const currentLang = localStorage.getItem('lang') || 'en';
        if (currentLang === 'hi') recognition.lang = 'hi-IN';
        else if (currentLang === 'kn') recognition.lang = 'kn-IN';
        else recognition.lang = 'en-US';
        
        recognition.start();
      });
    } else {
      micBtn.style.display = 'none'; // Hide if unsupported
      console.warn("Speech Recognition API is not supported in this browser.");
    }
    
    function fallbackReply(input) {
      let response = "";
      input = input.toLowerCase();
      
      if (localChatState === "init") {
          if (input.includes("farmer") || input.includes("agriculture")) {
              response = "I can help with agricultural schemes. Are you a small or large farmer?";
              localChatState = "farmer_size";
          } else if (input.includes("medical") || input.includes("health")) {
              response = "I can help with medical schemes. Are you looking for hospitalization coverage or maternity care?";
              localChatState = "medical_need";
          } else if (input.includes("education") || input.includes("student")) {
              response = "I see you are interested in educational schemes. Are you primarily seeking help with tuition fees or hostel fees?";
              localChatState = "education_need";
          } else if (input.includes("business") || input.includes("loan") || input.includes("start")) {
              response = "You may be eligible for general loan schemes. What is your approximate annual income?";
              localChatState = "loan_income";
          } else {
              response = "I can help you find schemes across Agriculture, Medical, Education, and Business. Could you tell me exactly what kind of support you need?";
          }
      } else if (localChatState === "farmer_size") {
          if (input.includes("small")) {
              response = "Small farmers have multiple benefits. Do you own your agricultural land?";
              localChatState = "farmer_land";
          } else {
              response = "Understood. Some equipment subsidies are available. Do you require financial support or crop insurance primarily?";
              localChatState = "farmer_need";
          }
      } else if (localChatState === "farmer_land") {
          response = "Thank you. Based on your profile as a small farmer with land, the 'Financial Assistance for Marginal Farmers' scheme seems perfect. Shall I show you the details?";
          localChatState = "init";
      } else if (localChatState === "farmer_need") {
          response = "Great. Based on your response, 'Pradhan Mantri Fasal Bima Yojana' could be a match. You can find this in our 'Personalized Schemes' section!";
          localChatState = "init";
      } else if (localChatState === "medical_need") {
           response = "Regardless of the exact treatment, the 'Ayushman Bharat PMJAY' covers a wide range of up to 5 Lakhs. Are you currently below the 1 Lakh income bracket?";
           localChatState = "medical_income";
      } else if (localChatState === "medical_income") {
           response = "Thank you for confirming. You are heavily likely to be eligible. I recommend completing the full Personalized Flow from the menu to secure it!";
           localChatState = "init";
      } else if (localChatState === "education_need") {
           response = "Understood. Is your family's annual income below 2.5 Lakhs?";
           localChatState = "education_income";
      } else if (localChatState === "education_income") {
           response = "Thank you. Both 'Pre-Matric Scholarship' and 'Post-Matric Hostel Allowance' might apply. Please check the Explore Schemes page for more info.";
           localChatState = "init";
      } else if (localChatState === "loan_income") {
           response = "Got it. Consider exploring the 'MUDRA Yojana' for massive business subsidies! You can start a new query with me below at any time.";
           localChatState = "init";
      } else {
           response = "I'm not sure about that. Let's start over. What kind of support do you need?";
           localChatState = "init";
      }
      return response;
    }

    async function translateText(text, fromLang, toLang) {
        if (fromLang === toLang || !text) return text;
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            return data[0].map(item => item[0]).join('');
        } catch (e) {
            console.error("Translation fail:", e);
            return text;
        }
    }

    async function sendMessage() {
      const originalText = inputField.value.trim();
      if (!originalText) return;

      const currentLang = localStorage.getItem('lang') || 'en';

      // Append user message natively
      const userBubble = document.createElement('div');
      userBubble.className = 'chat-bubble user-message';
      userBubble.innerHTML = `<p>${originalText}</p>`;
      wrapper.parentNode.insertBefore(userBubble, wrapper);
      
      inputField.value = '';
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

      // Add typing indicator
      const typingBubble = document.createElement('div');
      typingBubble.className = 'chat-bubble ai-message';
      typingBubble.style.opacity = '0.7';
      typingBubble.innerHTML = `<p><em>${typeof window.t === 'function' ? window.t("Thinking...") : "Thinking..."}</em></p>`;
      wrapper.parentNode.insertBefore(typingBubble, wrapper);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

      try {
        // ALWAYS process in English internally
        const englishText = await translateText(originalText, currentLang, 'en');

        // Call Flask Backend logic
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: englishText, session_id: sessionId })
        });
        
        wrapper.parentNode.removeChild(typingBubble);
        
        let finalResponse = "";
        let isError = false;
        
        if (response.ok) {
          const data = await response.json();
          finalResponse = data.reply;
        } else {
          isError = true;
          finalResponse = "Sorry, I encountered a communication error with the system.";
        }

        // Translate English response back to user's selected language
        const translatedReply = await translateText(finalResponse, 'en', currentLang);

        const aiBubble = document.createElement('div');
        aiBubble.className = 'chat-bubble ai-message';
        if (isError) aiBubble.style.color = '#d9534f';
        aiBubble.innerHTML = `<p>${translatedReply}</p>`;
        wrapper.parentNode.insertBefore(aiBubble, wrapper);
        
        speakText(translatedReply);

      } catch (err) {
        if (typingBubble.parentNode) {
          wrapper.parentNode.removeChild(typingBubble);
        }
        console.warn("Backend error, using offline local AI:", err);
        
        // Fallback offline flow follows the same translation cycle
        const englishText = await translateText(originalText, currentLang, 'en');
        const offlineReplyEnglish = fallbackReply(englishText);
        const translatedOfflineReply = await translateText(offlineReplyEnglish, 'en', currentLang);

        const aiBubble = document.createElement('div');
        aiBubble.className = 'chat-bubble ai-message';
        aiBubble.innerHTML = `<p>${translatedOfflineReply}</p>`;
        wrapper.parentNode.insertBefore(aiBubble, wrapper);
        
        speakText(translatedOfflineReply);
      }
      
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  });
</script>
<script src="theme.js?v=1776477080.03402"></script>
<script src="translations.js?v=1776477080.03402"></script>
</body>
</html>
