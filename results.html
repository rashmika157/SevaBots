<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommended Schemes - SevaBots</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .results-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px;
    }
    
    .results-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-text);
      text-align: center;
      margin-bottom: 40px;
    }

    .schemes-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .result-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-card h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary-text);
      margin: 0;
    }

    .reason-box {
      background-color: #f8fafc;
      padding: 16px 20px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
      color: var(--primary-text);
      font-size: 1.1rem;
      font-weight: 500;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .details-grid {
        grid-template-columns: 1fr;
      }
    }

    .details-section h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--primary-text);
      margin-bottom: 12px;
    }

    .details-list {
      list-style-type: disc;
      padding-left: 20px;
      color: var(--secondary-text);
      margin: 0;
    }

    .details-list.ordered {
      list-style-type: decimal;
    }

    .details-list li {
      margin-bottom: 8px;
    }

    .details-list li:last-child {
      margin-bottom: 0;
    }
    
    .apply-btn {
      margin-top: 16px;
      align-self: flex-start;
      padding: 14px 40px;
      width: auto;
    }


  </style>
</head>
<body class="dynamic-landing-page">
  <!-- Soft Background Effects Layer -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="top-nav" style="display: flex; justify-content: space-between; align-items: center; margin: 0 auto; margin-bottom: 24px; padding: 24px 5%; width: 100%; max-width: 1800px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="logo.jpg" alt="SevaBots Logo" style="width: 36px; height: 36px; border-radius: 50%;">
      <div class="logo">SevaBots</div>
    </div>
    <div id="nav-right-container" style="display: flex; align-items: center; gap: 12px;">
      <button onclick="window.history.back()" class="small-btn" style="background: transparent; color: var(--primary-text); border: 1px solid var(--border-color);">Back</button>
      <a href="index.html" class="small-btn">Home</a>
    </div>
  </div>

  <div class="results-container">
    <h1 class="results-title" style="text-align: center; color: #9d174d;">Recommended Schemes</h1>
    
    <div class="schemes-list" id="dynamic-results-container">
      <div class="result-card"><div class="reason-box">Loading personalized schemes...</div></div>
    </div>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const listContainer = document.getElementById('dynamic-results-container');
    
    // Parse the data passed from the personalized schemes form
    const userAnswers = JSON.parse(localStorage.getItem('userAnswers') || '{}');
    const occupation = localStorage.getItem('userOccupation') || '';

    function renderMatches(matchingSchemes) {
        listContainer.innerHTML = '';
        
        if (!matchingSchemes || matchingSchemes.length === 0) {
            listContainer.innerHTML = '<div class="result-card"><div class="reason-box">No exact schemes match your specific answers. Please adjust your criteria on the previous page or explore all general schemes.</div></div>';
            return;
        }

        matchingSchemes.forEach(scheme => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <h2>${scheme.name}</h2>
                <div class="reason-box">Matched based on your profile via Backend Server</div>
                <div class="details-grid" style="margin-top: 16px;">
                  <div class="details-section" style="grid-column: 1 / -1;">
                    <h3>Description</h3>
                    <p style="color: var(--secondary-text); font-size: 1.125rem;">${scheme.benefits}</p>
                    <p style="color: var(--secondary-text); margin-top: 8px;"><strong>Available In:</strong> ${scheme.state}</p>
                  </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 16px;">
                  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="btn apply-btn modal-trigger-btn" style="margin-top: 0; width: auto;">View Details</button>
                  </div>
                </div>
            `;
            
            const detailsBtn = card.querySelector('.modal-trigger-btn');
            detailsBtn.addEventListener('click', () => {
                 if (window.showSchemeModal) window.showSchemeModal(scheme);
            });

            listContainer.appendChild(card);
        });
    }

    fetch('http://127.0.0.1:5000/api/match', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ 
            occupation: occupation, 
            userAnswers: userAnswers 
        })
    })
      .then(res => {
         if (!res.ok) throw new Error('Backend response not OK');
         return res.json();
      })
      .then(data => renderMatches(data))
      .catch(err => {
         console.warn('Backend match failed, falling back to local JS matching:', err);
         
         fetch('schemes.json')
           .then(res => {
             if (!res.ok) throw new Error('Local file not found');
             return res.json();
           })
           .then(allSchemes => {
              let income = "Any";
              let need = "Not sure";
              
              if (occupation === "Agriculture Sector") {
                  need = userAnswers["What kind of support do you need?"] || "Not sure";
                  income = userAnswers["What is your annual family income?"] || "Any";
              } else if (occupation === "Medical Sector") {
                  need = userAnswers["What is your primary healthcare requirement?"] || "Not Applicable";
                  income = userAnswers["What is your annual family income?"] || "Any";
              } else if (occupation === "Education Sector") {
                  need = userAnswers["Are you seeking support for tuition or hostel fees?"] || "Not Applicable";
                  income = userAnswers["What is your annual family income?"] || "Any";
              } else if (occupation === "Others") {
                  need = userAnswers["What is your primary objective?"] || "Not Applicable";
                  income = userAnswers["What is your annual family income?"] || "Any";
              }

              const matchingSchemes = allSchemes.filter(scheme => {
                  if (scheme.target === 'General') return false;
                  
                  const matchOccupation = (scheme.target === occupation);
                  const matchNeed = (scheme.category === need);
                  const matchIncome = (scheme.income === "Any" || scheme.income === income);
                  
                  return matchOccupation && matchNeed && matchIncome;
              });
              
              renderMatches(matchingSchemes);
           })
           .catch(fallbackErr => {
              console.error('Error loading matching schemes locally:', fallbackErr);
              listContainer.innerHTML = '<div class="result-card"><div class="reason-box">Failed to match schemes correctly. Ensure your local server is running.</div></div>';
           });
      });
  });
</script>
<script src="theme.js?v=1776477080.03402"></script>
<script src="translations.js?v=1776477080.03402"></script>
<script src="modal.js?v=2"></script>
</body>
</html>
