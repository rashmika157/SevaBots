<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommended Schemes - SevaBot</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .results-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px;
    }
    
    .results-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-text);
      text-align: center;
      margin-bottom: 40px;
    }

    .schemes-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .result-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-card h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary-text);
      margin: 0;
    }

    .reason-box {
      background-color: #f8fafc;
      padding: 16px 20px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
      color: var(--primary-text);
      font-size: 1.1rem;
      font-weight: 500;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .details-grid {
        grid-template-columns: 1fr;
      }
    }

    .details-section h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--primary-text);
      margin-bottom: 12px;
    }

    .details-list {
      list-style-type: disc;
      padding-left: 20px;
      color: var(--secondary-text);
      margin: 0;
    }

    .details-list.ordered {
      list-style-type: decimal;
    }

    .details-list li {
      margin-bottom: 8px;
    }

    .details-list li:last-child {
      margin-bottom: 0;
    }
    
    .apply-btn {
      margin-top: 16px;
      align-self: flex-start;
      padding: 14px 40px;
      width: auto;
    }


  </style>
</head>
<body class="dynamic-landing-page">
  <!-- Soft Background Effects Layer -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="top-nav" style="display: flex; justify-content: space-between; align-items: center; margin: 0 auto; margin-bottom: 24px; padding: 24px 5%; width: 100%; max-width: 1800px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 24px;">
      <button onclick="window.history.back()" class="nav-btn" data-i18n="Back">&#8592; Back</button>
      <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
        <img src="logo.jpg" alt="SevaBot Logo" style="width: 36px; height: 36px; border-radius: 50%;">
        <div class="logo">SevaBot</div>
      </a>
    </div>
    <div id="nav-right-container" style="display: flex; align-items: center; gap: 12px; position: relative;">
      <div id="nav-profile-icon" onclick="toggleDropdown()" style="display: none; width: 44px; height: 44px; border-radius: 50%; background-color: #e0f2fe; color: #0369a1; align-items: center; justify-content: center; font-weight: 600; font-size: 1.25rem; border: 2px solid #bae6fd; cursor: pointer; transition: transform 0.2s;"></div>
      <!-- Profile Dropdown -->
      <div id="profile-dropdown" style="display: none; position: absolute; top: 60px; right: 0; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 8px; width: 250px; z-index: 1000;">
        <a href="previous-schemes.html" style="display: block; text-decoration: none; padding: 12px 16px; cursor: pointer; border-radius: 8px; font-weight: 500; font-size: 0.95rem; color: var(--primary-text); transition: background 0.2s;" onmouseover="this.style.background='#f0f9ff'" onmouseout="this.style.background='transparent'" data-i18n="My Profile">My Profile</a>
        <div onclick="handleLogout()" style="padding: 12px 16px; cursor: pointer; border-radius: 8px; font-weight: 500; font-size: 0.95rem; color: #ef4444; margin-top: 4px; transition: background 0.2s;" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='transparent'" data-i18n="Logout">Logout</div>
      </div>
      <script>
        function toggleDropdown() {
          const dropdown = document.getElementById("profile-dropdown");
          dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }
        function handleLogout() {
          localStorage.removeItem("userProfile");
          window.location.href = "index.html";
        }
        document.addEventListener("DOMContentLoaded", () => {
          const userStr = localStorage.getItem("userProfile");
          const profileIcon = document.getElementById("nav-profile-icon");
          if (userStr && profileIcon) {
            try {
              const userData = JSON.parse(userStr);
              if (userData.name) {
                profileIcon.textContent = userData.name.charAt(0).toUpperCase();
                profileIcon.style.display = "flex";
              }
            } catch(e){}
          }
        });
      </script>
    </div>
  </div>

  <div class="results-container">
    <h1 class="results-title" style="text-align: center; color: var(--heading-color);" data-i18n="Recommended Schemes">Recommended Schemes</h1>
    
    <div class="schemes-list" id="dynamic-results-container">
      <div class="result-card"><div class="reason-box" data-i18n="Loading personalized schemes...">Loading personalized schemes...</div></div>
    </div>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const listContainer = document.getElementById('dynamic-results-container');
    
    // Parse the data passed from the personalized schemes form
    const userAnswers = JSON.parse(localStorage.getItem('userAnswers') || '{}');
    const occupation = localStorage.getItem('userOccupation') || '';

    function renderMatches(matchingSchemes) {
        listContainer.innerHTML = '';
        
        if (!matchingSchemes || matchingSchemes.length === 0) {
            listContainer.innerHTML = `<div class="result-card"><div class="reason-box">${window.t("No exact schemes match your specific answers. Please adjust your criteria on the previous page or explore all general schemes.")}</div></div>`;
            return;
        }

        matchingSchemes.forEach(scheme => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <h2>${window.t(scheme.name)}</h2>
                <div class="reason-box">${window.t("Matched based on your profile via Backend Server")}</div>
                <div class="details-grid" style="margin-top: 16px;">
                  <div class="details-section" style="grid-column: 1 / -1;">
                    <h3>${window.t("Description")}</h3>
                    <p style="color: var(--secondary-text); font-size: 1.125rem;">${window.t(scheme.benefits)}</p>
                    <p style="color: var(--secondary-text); margin-top: 8px;"><strong>${window.t("Available In:")}</strong> ${window.t(scheme.state)}</p>
                  </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 16px;">
                  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="btn apply-btn modal-trigger-btn" style="margin-top: 0; width: auto;">${window.t("View Details")}</button>
                  </div>
                </div>
            `;
            
            const detailsBtn = card.querySelector('.modal-trigger-btn');
            detailsBtn.addEventListener('click', () => {
                 if (window.showSchemeModal) window.showSchemeModal(scheme);
            });

            listContainer.appendChild(card);
        });
    }

    fetch('/api/match', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ 
            occupation: occupation, 
            userAnswers: userAnswers 
        })
    })
      .then(res => {
         if (!res.ok) throw new Error('Backend response not OK');
         return res.json();
      })
      .then(data => renderMatches(data))
      .catch(err => {
         console.warn('Backend match failed, falling back to local JS matching:', err);
         
         fetch('schemes.json')
           .then(res => {
             if (!res.ok) throw new Error('Local file not found');
             return res.json();
           })
           .then(allSchemes => {
              let income = "Any";
              let need = "Not sure";
              
              if (occupation === "Agriculture Sector") {
                  need = userAnswers["What kind of support do you need?"] || "Not sure";
                  income = userAnswers["What is your annual family income?"] || "Any";
              } else if (occupation === "Medical Sector") {
                  need = userAnswers["What is your primary healthcare requirement?"] || "Not Applicable";
                  income = userAnswers["What is your annual family income?"] || "Any";
              } else if (occupation === "Education Sector") {
                  need = userAnswers["Are you seeking support for tuition or hostel fees?"] || "Not Applicable";
                  income = userAnswers["What is your annual family income?"] || "Any";
              } else if (occupation === "Others") {
                  need = userAnswers["What is your primary objective?"] || "Not Applicable";
                  income = userAnswers["What is your annual family income?"] || "Any";
              }

              const matchingSchemes = allSchemes.filter(scheme => {
                  if (scheme.target === 'General') return false;
                  
                  const matchOccupation = (scheme.target === occupation);
                  const matchNeed = (scheme.category === need);
                  const matchIncome = (scheme.income === "Any" || scheme.income === income);
                  
                  return matchOccupation && matchNeed && matchIncome;
              });
              
              renderMatches(matchingSchemes);
           })
           .catch(fallbackErr => {
              console.error('Error loading matching schemes locally:', fallbackErr);
              listContainer.innerHTML = '<div class="result-card"><div class="reason-box">Failed to match schemes correctly. Ensure your local server is running.</div></div>';
           });
      });
  });
</script>
<script src="theme.js?v=1776477080.03402"></script>
<script src="translations.js?v=1776477080.03402"></script>
<script src="modal.js?v=2"></script>
</body>
</html>
